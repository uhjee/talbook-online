<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>탈북 온라인</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="boost-fx"></div>
    <div id="slide-fx"></div>
    <div id="shout">
      <svg class="face" viewBox="0 0 48 48" aria-hidden="true">
        <defs><clipPath id="face-clip"><circle cx="24" cy="24" r="21" /></clipPath></defs>
        <circle cx="24" cy="24" r="21" fill="#ffd23f" />
        <g clip-path="url(#face-clip)">
          <ellipse cx="24" cy="50" rx="19" ry="13" fill="#4f6a8f" stroke="#171922" stroke-width="2" />
          <rect class="scarf" x="12" y="36.5" width="24" height="5" rx="2.5" fill="#e9e2cf" stroke="#171922" stroke-width="1.6" />
        </g>
        <circle cx="11.6" cy="25.5" r="2.4" fill="#f2cdab" stroke="#171922" stroke-width="1.6" />
        <circle cx="36.4" cy="25.5" r="2.4" fill="#f2cdab" stroke="#171922" stroke-width="1.6" />
        <circle class="skin" cx="24" cy="24" r="12.5" fill="#f2cdab" stroke="#171922" stroke-width="2" />
        <path d="M11.8 22 Q11 10.5 24 10.5 Q37 10.5 36.2 22 Q30 16.5 24 17.5 Q18 16.5 11.8 22 Z" fill="#1c1612" />
        <g class="tuft" fill="#1c1612">
          <path d="M15 13 L11.5 5.5 L19.5 11 Z" />
          <path d="M22 11 L24.5 2.5 L27.5 11 Z" />
          <path d="M30 11.5 L37.5 6 L34 14 Z" />
        </g>
        <g class="cap">
          <path d="M11 19.5 Q12 5 24 5 Q36 5 37 19.5 Z" fill="#4f6a8f" stroke="#171922" stroke-width="2" stroke-linejoin="round" />
          <rect x="8.5" y="17.5" width="31" height="4.6" rx="2.3" fill="#3f5674" stroke="#171922" stroke-width="1.8" />
        </g>
        <g class="dirt" fill="#6b5236" opacity="0.75">
          <ellipse cx="31.5" cy="29.5" rx="3" ry="1.9" />
          <ellipse cx="16" cy="21.5" rx="2.2" ry="1.4" />
        </g>
        <g class="scratch" stroke="#c23a2e" stroke-width="1.3" stroke-linecap="round">
          <path d="M14.5 28.5 L18 30.5" />
          <path d="M29.5 19.5 L33 18" />
        </g>
        <path d="M16.6 21.6 L21.6 22.8 M31.4 21.6 L26.4 22.8" stroke="#171922" stroke-width="1.8" stroke-linecap="round" />
        <ellipse cx="19.4" cy="25.8" rx="1.7" ry="2.3" fill="#171922" />
        <ellipse cx="28.6" cy="25.8" rx="1.7" ry="2.3" fill="#171922" />
        <ellipse class="mouth" cx="24" cy="31.6" rx="3.4" ry="2.9" fill="#7a2b22" stroke="#171922" stroke-width="1.2" />
        <circle cx="24" cy="24" r="21" fill="none" stroke="#171922" stroke-width="3" />
      </svg>
      <div class="say"><b>리용길</b><span></span></div>
    </div>

    <div id="hud" class="hidden">
      <div id="hud-top">
        <span id="stage"></span>
        <span id="timer">0:00.00</span>
      </div>
      <div id="progress">
        <div id="progress-fill"></div>
        <i style="left: 16.67%"></i>
        <i style="left: 43.33%"></i>
        <i style="left: 80%"></i>
      </div>
    </div>
    <div id="toast"></div>
    <div id="taunt"></div>
    <div id="keys" class="hidden">
      <div class="keys-pc">
        <div class="k" data-act="move"><span class="cap">←</span><span class="cap">→</span><em>이동</em></div>
        <div class="k" data-act="jump"><span class="cap wide">Space</span><em>점프</em></div>
        <div class="k" data-act="slide"><span class="cap">↓</span><em>슬라이드</em></div>
        <div class="k" data-act="hide"><span class="cap hold">↓</span><em>꾹 기어가기</em></div>
        <div class="k" data-act="boost"><span class="cap">↑</span><em>부스터</em></div>
      </div>
      <div class="keys-touch">
        <div class="k" data-act="move"><span class="ges ges-move"><b></b></span><em>이동</em></div>
        <div class="k" data-act="jump"><span class="ges ges-up"><b></b></span><em>점프</em></div>
        <div class="k" data-act="slide"><span class="ges ges-down"><b></b></span><em>슬라이드</em></div>
        <div class="k" data-act="hide"><span class="ges ges-hold"><b></b></span><em>기어가기</em></div>
        <div class="k" data-act="boost"><span class="ges ges-tap"><b></b></span><em>부스터</em></div>
      </div>
    </div>

    <div id="menu" class="screen">
      <div class="panel">
        <p class="kicker">달려서 귀순하는 3D 아케이드</p>
        <h1>탈북 온라인</h1>
        <ol class="route">
          <li>아오지 탄광</li>
          <li>북한 시내</li>
          <li>국경과 DMZ</li>
          <li>SS사단</li>
        </ol>
        <input id="nick" type="text" maxlength="8" placeholder="닉네임 (2~8자)" autocomplete="off" />
        <p id="nick-error" class="error"></p>
        <button id="btn-start" class="primary">탈북 시작</button>
        <button id="btn-rank">랭킹 보기</button>
      </div>
    </div>

    <div id="result" class="screen hidden">
      <div class="panel">
        <p class="kicker">터치다운</p>
        <h2>탈북 성공!</h2>
        <p id="res-nick" class="sub"></p>
        <p id="res-time" class="big"></p>
        <p id="res-rank" class="rank"></p>
        <p id="res-title" class="badge"></p>
        <p id="res-stats" class="sub"></p>
        <button id="btn-share" class="primary">공유하기</button>
        <div class="row">
          <button id="btn-save">이미지 저장</button>
          <button id="btn-rank2">랭킹 보기</button>
        </div>
        <button id="btn-retry">다시 하기</button>
      </div>
    </div>

    <div id="fail" class="screen hidden">
      <div class="panel">
        <h2 class="fail">탈북 실패</h2>
        <p id="fail-reason" class="sub"></p>
        <button id="btn-fail-retry" class="primary">다시 하기</button>
      </div>
    </div>

    <div id="rank" class="screen hidden">
      <div class="panel">
        <h2>랭킹</h2>
        <div class="tabs">
          <button id="tab-all" class="on">전체 순위</button>
          <button id="tab-today">오늘 순위</button>
        </div>
        <ol id="rank-list"></ol>
        <p class="note">시험판에서는 이 기기의 기록만 보입니다.</p>
        <button id="btn-rank-close">닫기</button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
